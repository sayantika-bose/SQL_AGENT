<div class="chat-container">
  <div class="chat-header">
    <h1>Query Expert</h1>
    <p>Ask questions about your data</p>
  </div>

  <div class="chat-messages">
    <div *ngFor="let message of messages; let i = index" 
         [ngClass]="'message message-' + message.type">
      <div class="message-avatar">
        <span *ngIf="message.type === 'user'">U</span>
        <span *ngIf="message.type === 'bot'">AI</span>
        <span *ngIf="message.type === 'error'">!</span>
      </div>

      <!-- User Messages with wrapper -->
      <div class="message-wrapper" *ngIf="message.type === 'user'">
        <div class="message-content">
          <div class="message-text">
            {{ message.content }}
          </div>
        </div>
        <div class="message-footer">
          <span class="message-time">{{ message.timestamp | date:'short' }}</span>
        </div>
      </div>

      <!-- Error Messages with wrapper -->
      <div class="message-wrapper" *ngIf="message.type === 'error'">
        <div class="message-content">
          <div class="message-text">
            {{ message.content }}
          </div>
        </div>
        <div class="message-footer">
          <span class="message-time">{{ message.timestamp | date:'short' }}</span>
        </div>
      </div>
      
      <!-- Bot Messages with wrapper -->
      <div class="message-wrapper" *ngIf="message.type === 'bot'">
        <div class="message-content">
          <div class="message-text" 
               [innerHTML]="message.htmlContent">
          </div>
          
          <!-- Document References -->
          <div *ngIf="message.references && message.references.length > 0" 
               class="document-references">
            <div class="references-label">
              📎 Source Documents:
            </div>
            <div class="reference-tags">
              <span *ngFor="let reference of message.references" 
                    class="reference-tag"
                    [ngClass]="'reference-' + getFileTypeClass(reference)"
                    [title]="reference">
                {{ reference }}
              </span>
            </div>
          </div>
        </div>
        <div class="message-footer">
          <span class="message-time">{{ message.timestamp | date:'short' }}</span>
          <button 
            *ngIf="message.userQuestion"
            (click)="regenerateResponse(i)"
            [disabled]="isLoading"
            class="regenerate-button"
            title="Regenerate response">
            <span class="regenerate-icon">↻</span>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="isLoading" class="message message-bot">
      <div class="message-avatar">AI</div>
      <div class="message-content">
        <div class="loader-container">
          <div class="dots-loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <div class="progress-text">{{ progressMessage }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <input 
      type="text" 
      [(ngModel)]="userInput"
      (keyup.enter)="sendMessage()"
      [disabled]="isLoading"
      placeholder="Type your question here..."
      class="input-field">
    <button 
      *ngIf="!isLoading"
      (click)="sendMessage()" 
      [disabled]="!userInput.trim()"
      class="send-button">
      Send
    </button>
    <button 
      *ngIf="isLoading"
      (click)="terminateTask()" 
      class="stop-button">
      <span class="stop-icon"></span>
      Stop
    </button>
  </div>
</div>
