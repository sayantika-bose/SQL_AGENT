[tool.poetry]
name = "indexer"
version = "0.1.0"
description = "Document indexing service for Query Expert App"
authors = ["Sayantika Bose sayantikabose99@gmail.com"]
packages = [{include = "indexer"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.6"
aiofiles = "^23.2.0"
numpy = "^1.26.0"
opensearch-py = "^2.4.0"
requests = "^2.31.0"
PyPDF2 = "^3.0.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
pandas = "^2.1.0"
pytesseract = "^0.3.10"
Pillow = "^11.0.0"
pdf2image = "^1.16.3"
pymupdf = "^1.23.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"